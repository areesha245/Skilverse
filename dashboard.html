<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Skillverse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <main class="dash">
    <header class="dash-header">
      <div>
        <h1>Welcome back, <span id="userName"></span></h1>
        <p class="muted">Pick a zone and keep your streak alive.</p>
      </div>
      <button id="logoutBtn" class="btn btn-secondary" type="button">Log out</button>
    </header>
    <section class="stat-grid">
      <div class="card"><span class="muted">Level</span><strong id="userLevel"></strong></div>
      <div class="card"><span class="muted">Total XP</span><strong id="userXp"></strong></div>
      <div class="card"><span class="muted">Streak (days)</span><strong id="userStreak"></strong></div>
    </section>
  </main>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
