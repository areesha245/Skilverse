<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Skillverse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div class="auth-layout">
    <section class="auth-hero">
      <h1>Study like it<br>is a game.</h1>
      <p>Turn notes into stories, explain concepts, win the interview.</p>
    </section>
    <section class="auth-panel">
      <form id="loginForm" class="auth-form" novalidate>
        <h2>Welcome back</h2>
        <p id="formError" class="form-error" hidden></p>
        <label class="field"><span>Email</span>
          <input type="email" name="email" placeholder="you@university.edu" autocomplete="email">
        </label>
        <label class="field"><span>Password</span>
          <input type="password" name="password" placeholder="Your password" autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-primary">Log in</button>
        <p class="auth-switch">New here? <a href="signup.html">Sign up</a></p>
      </form>
    </section>
  </div>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
